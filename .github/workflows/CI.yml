name: CI

on: 
  pull_request:
    branches: [main]

permissions: 
  contents: read
  id-token: write

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12.3'
      
      - name: Install Black
        run: pip install Black
      
      - name: Black formating checkout
        run: black --check src/  
